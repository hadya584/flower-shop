<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='/login.css') }}">
    <style>
        @font-face {
            font-family: 'Movella';
            src: url("{{ url_for('static', filename='/fonts/CsMovellaRegularDemo-vnOXZ.otf') }}") format('opentype');
            font-weight: normal;
            font-style: normal;
            font-display: swap;
        }
    </style>
</head>
<body>
    <div class="login-container">
        <h2>Sign Up</h2>
        {% with messages = get_flashed_messages() %}
            {% if messages %}
                <div class="error">
                {% for message in messages %}
                    {{ message }}
                {% endfor %}
                </div>
            {% endif %}
        {% endwith %}
        <form method="post">
            <p>Username: <input type="text" name="username" placeholder="Username" required></p>
            <p>Password: <input type="password" name="password" placeholder="Password" required></p>
            <p>First Name: <input type="text" name="fname" placeholder="First Name" required></p>
            <p>Last Name: <input type="text" name="lname" placeholder="Last Name" required></p>
            <p><button type="submit">Create Account</button></p>
        </form>
    </div>
</body>
</html>
